# Dispersions mirror sim/spec_sheet.py (generated by harness/make_specs.py; do not hand-edit ranges).
# Smoke test: one dispersion sample per fault variant, to check every fault is wired through.
[monte_carlo]
n_samples = 1
seed = 11
method = "lhs"

[monte_carlo.variables]
dry_mass_kg = { dist = "uniform", min = 1225.0, max = 1275.0 }
engine_tau_s = { dist = "uniform", min = 0.08, max = 0.12 }
init_altitude_m = { dist = "uniform", min = 1400.0, max = 1600.0 }
init_tilt_deg = { dist = "uniform", min = 15.0, max = 25.0 }
init_vx_mps = { dist = "uniform", min = 40.0, max = 50.0 }
init_vy_mps = { dist = "uniform", min = -1.5, max = 1.5 }
init_vz_mps = { dist = "uniform", min = -28.0, max = -22.0 }
init_x_m = { dist = "uniform", min = -1900.0, max = -1700.0 }
init_y_m = { dist = "uniform", min = -40.0, max = 40.0 }
isp_s = { dist = "uniform", min = 311.85, max = 318.15 }
noise_seed = { dist = "uniform", min = 0.0, max = 2147483648.0 }
propellant_kg = { dist = "uniform", min = 218.5, max = 241.5 }
thrust_scale = { dist = "uniform", min = 0.98, max = 1.02 }

[meta_sweep]
fault = [
    "none",
    "gravity_earth",
    "gravity_scale@0.005",
    "gravity_scale@0.02",
    "gravity_scale@0.1",
    "isp_low@0.005",
    "isp_low@0.01",
    "isp_low@0.02",
    "isp_low@0.05",
    "isp_low@0.2",
    "thrust_lbf",
    "thrust_scale@-0.02",
    "thrust_scale@-0.05",
    "thrust_scale@-0.1",
    "thrust_scale@0.1",
    "dry_mass_lb",
    "propellant_short@0.02",
    "propellant_short@0.1",
    "propellant_short@0.3",
    "propellant_short@0.6",
    "tilt_deg_as_rad",
    "vz_sign",
    "mass_flow_dt",
    "inertia_x10",
    "site_offset@100",
    "thrust_world_frame",
    "mass_not_updated",
    "gravity_twice",
    "gravity_sign",
    "rcs_torque_sign",
    "throttle_unclamped",
    "centrifugal_sign",
    "engine_lag@1.5",
    "engine_lag@10",
    "mdot_lunar_g",
    "quat_wxyz",
    "quat_conjugate",
    "fsw_gravity_earth",
    "crossrange_sign",
    "mass_estimate_dry",
    "stale_command@1",
    "stale_command@2",
    "stale_command@10",
    "altimeter_feet",
    "altimeter_bias@0.5",
    "altimeter_bias@1",
    "altimeter_bias@2",
    "altimeter_bias@10",
    "altimeter_bias@50",
    "velocity_xy_swap",
    "altimeter_stuck@100",
]
